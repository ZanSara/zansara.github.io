<!DOCTYPE html>
<html lang="{language}">
<head>
  <title>{title} · {site_title}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="author" content="{author}">
  <meta name="description" content="{description}">
  <meta name="keywords" content="{keywords}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{title} · {site_title}">
  <meta name="twitter:description" content="{description}">
  <meta property="og:url" content="{canonical_url}">
  <meta property="og:site_name" content="{site_title}">
  <meta property="og:title" content="{title}">
  <meta property="og:description" content="{description}">
  <meta property="og:locale" content="en">
  <meta property="og:type" content="article">
  <meta name="msvalidate.01" content="CD2BB9B57B16AF914327870432D856C1" />
  <meta name="yandex-verification" content="a886d3d5d2b57cb5" />
  {meta_tags}
  <link rel="canonical" href="{canonical_url}">
  <link rel="stylesheet" href="/css/style.css" media="screen">
  <link rel="icon" type="image/svg+xml" href="{favicon_svg}" sizes="any">
  <link rel="icon" type="image/png" href="{favicon_32}" sizes="32x32">
  <link rel="apple-touch-icon" href="{favicon_32}">
  <script data-goatcounter="https://zansaradev.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>

<body>

  <!-- Theme toggle -->
  <input type="checkbox" id="theme-toggle" aria-label="Dark theme">
  <label for="theme-toggle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.3"/>
      <path d="M12 2 A10 10 0 0 1 12 22 Z" fill="currentColor"/>
    </svg>
  </label>

  <!-- Load theme immediately to avoid flash -->
  <script>
    (function() {{
      const themeToggle = document.getElementById('theme-toggle');
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {{
        themeToggle.checked = true;
      }}
    }})();
  </script>

  <main>

    {header}

    {content}

    {footer}

  </main>

  {mermaid_script}

  <!-- Theme toggle persistence -->
  <script>
    (function() {{
      const themeToggle = document.getElementById('theme-toggle');

      // Load saved theme preference
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {{
        themeToggle.checked = true;
      }}

      // Save theme preference on change
      themeToggle.addEventListener('change', function() {{
        if (this.checked) {{
          localStorage.setItem('theme', 'dark');
        }} else {{
          localStorage.setItem('theme', 'light');
        }}
      }});
    }})();
  </script>

</body>
</html>
